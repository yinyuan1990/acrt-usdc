# /opt/arclaunch/docker-compose.yml — isolated from the existing solanft stack.
# indexer / db / keeper services will be added once contracts are on testnet.
name: arclaunch

services:
  web:
    build:
      context: ./web
    image: arclaunch/web:latest
    container_name: arclaunch-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
