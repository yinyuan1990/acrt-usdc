# /etc/nginx/conf.d/arclaunch.conf
# Launchpad lives on its own hostname; habo.conf is untouched.
# Until DNS for launch.hzmrbq.com exists, port 8080 serves a preview by IP.

upstream arclaunch_web { server 127.0.0.1:3100; }

map $http_upgrade $arclaunch_conn {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 8080;
    server_name launch.hzmrbq.com;

    # Next build assets are content-hashed: cache forever.
    location ^~ /_next/static/ {
        proxy_pass http://arclaunch_web;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://arclaunch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arclaunch_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}

# Preview by raw IP on :8080 (any host header).
server {
    listen 8080 default_server;
    server_name _;
    location / {
        proxy_pass http://arclaunch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arclaunch_conn;
        proxy_set_header Host $host;
    }
}
