# /etc/nginx/conf.d/arclaunch.conf
# Launchpad lives on its own hostname; habo.conf is untouched.
# TLS blocks were created by Certbot (ops/enable-tls.sh); keep them when editing.

upstream arclaunch_web { server 127.0.0.1:3100; }
upstream arclaunch_api { server 127.0.0.1:3101; }

map $http_upgrade $arclaunch_conn {
    default upgrade;
    ''      close;
}

server {
    server_name launch.hzmrbq.com;

    # Indexer REST API (uploads up to 1 MB)
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://arclaunch_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Indexer WebSocket
    location = /ws {
        proxy_pass http://arclaunch_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Next build assets are content-hashed: cache forever.
    location ^~ /_next/static/ {
        proxy_pass http://arclaunch_web;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://arclaunch_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arclaunch_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/launch.hzmrbq.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/launch.hzmrbq.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = launch.hzmrbq.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name launch.hzmrbq.com;
    return 404; # managed by Certbot
}
